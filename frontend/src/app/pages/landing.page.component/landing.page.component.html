<div
  class="hero h-screen"
  style="
    background-image: url(https://res.cloudinary.com/ntbphotos/image/upload/f_auto,q_auto,w_1920/bg_image_gk75yd);
  "
>
  <div class="hero-overlay bg-opacity-75 backdrop-blur-[2px]"></div>

  <div class="hero-content text-neutral-content text-center">
    <div class="max-w-2xl">
      <div class="badge badge-error gap-2 mb-4 font-bold p-3 uppercase">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          class="inline-block w-4 h-4 stroke-current"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        Upgrade your stopping power
      </div>

      <h1 class="mb-6 text-6xl md:text-7xl font-black uppercase tracking-tighter italic">
        Complete your <span class="text-error">setup!</span>
      </h1>

      <p class="mb-8 text-xl font-medium text-gray-200">
        <span class="text-white font-bold">Need to Brake</span> is the definitive tool to find the
        perfect disc for your calipers. Precision data for those who never settle for second best.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
        <button
          class="btn btn-error btn-lg px-10 group shadow-[0_0_20px_rgba(255,0,0,0.3)]"
          [routerLink]="['/select']"
        >
          Get Started
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5 group-hover:translate-x-1 transition-transform"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"
            />
          </svg>
        </button>

        <button class="btn btn-ghost btn-lg hover:bg-white/10" [routerLink]="['/forum']">
          Explore the Forum
        </button>
      </div>
    </div>
  </div>
</div>
