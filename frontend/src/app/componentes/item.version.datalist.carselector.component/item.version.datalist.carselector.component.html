<input
  class="disc-input w-full focus:input-primary"
  type="text"
  placeholder="Type to search..."
  [attr.list]="dataId"
  [value]="item() ? (item() | formatVersion) : ''"
  (input)="onSearchInput($event)"
  (change)="onSelectOption($event)"
  (keyup.enter)="onEnterPressed($event)"
  [class.valid]="item() ? !!item().id : false"
/>
<datalist [id]="dataId">
  @for (version of items(); track version.id) {
    <option [value]="version | formatVersion"></option>
  }
</datalist>
