<div class="flex gap-2.5 md:gap-3.5 items-start">
  <div class="flex-1">
    <div class="bg-base-200/60 rounded-2xl p-3.5 md:p-4 border color-border">
      <div class="flex justify-between items-center gap-3 mb-2.5">
        <div
          class="flex flex-row items-center cursor-pointer"
          [routerLink]="[`/profile/${comment().author.id}`]"
        >
          <div class="avatar placeholder shrink-0 mt-0.5">
            <div
              class="bg-neutral text-neutral-content rounded-full w-8 md:w-10 border color-border"
            >
              <img [src]="comment().author.urlAvatar || 'images/profile_image.webp'" alt="Avatar" />
            </div>
          </div>
          <span class="text-xs md:text-sm font-bold text-base-content">
            @{{ comment().author.username }}
          </span>
        </div>
        <span class="text-[10px] md:text-xs text-base-content/40 whitespace-nowrap">
          {{ comment().createdAt | date: 'short' }}
        </span>
      </div>
      <!-- Edit comment -->
      @if (isEditing() && isOwner()) {
        <form [formGroup]="editForm" (ngSubmit)="saveEdit()">
          <div
            class="text-sm md:text-base text-base-content/80 leading-relaxed whitespace-pre-wrap wrap-break-word"
          >
            <textarea
              class="w-full border-2 rounded-2xl px-4 b-blue-400"
              formControlName="content"
            ></textarea>
          </div>
          <div class="flex justify-end gap-2">
            <div class="justify-self-start">
              <button type="button" class="button-delete" (click)="deleteComment()">
                Delete comment
              </button>
            </div>
            <button type="button" (click)="isEditing.set(false)" class="button-cancel">
              Cancel
            </button>
            <button
              type="submit"
              [disabled]="editForm.invalid || editForm.pristine"
              class="button-save"
            >
              Save
            </button>
          </div>
        </form>
      } @else {
        <div class="flex flex-row w-full">
          <p
            class="flex-1 text-sm md:text-base text-base-content/80 leading-relaxed whitespace-pre-wrap wrap-break-word"
          >
            {{ comment().content }}
          </p>
          @if (isOwner()) {
            <span class="cursor-pointer self-end" (click)="startEdit()">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                <g
                  fill="true"
                  stroke="#3b82f6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1"
                >
                  <g stroke-width="2">
                    <path
                      stroke-dasharray="56"
                      d="M3 21l2 -6l11 -11c1 -1 3 -1 4 0c1 1 1 3 0 4l-11 11l-6 2"
                    >
                      <animate
                        fill="freeze"
                        attributeName="stroke-dashoffset"
                        dur="0.6s"
                        values="56;0"
                      />
                    </path>
                    <path stroke-dasharray="8" stroke-dashoffset="8" d="M15 5l4 4">
                      <animate
                        fill="freeze"
                        attributeName="stroke-dashoffset"
                        begin="0.6s"
                        dur="0.2s"
                        to="0"
                      />
                    </path>
                  </g>
                  <path stroke-dasharray="8" stroke-dashoffset="8" d="M6 15l3 3">
                    <animate
                      fill="freeze"
                      attributeName="stroke-dashoffset"
                      begin="0.8s"
                      dur="0.2s"
                      to="0"
                    />
                  </path>
                </g>
              </svg>
            </span>
          }
        </div>
      }
    </div>
  </div>
</div>
