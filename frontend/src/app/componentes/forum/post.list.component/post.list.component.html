<div class="p-6">
  <div class="flex flex-col gap-4 w-full">
    @for (post of forum().items; track post.id) {
      <div
        class="group flex flex-col color-surface border color-border shadow-sm hover:shadow-md transition-all duration-200 rounded-2xl overflow-hidden"
      >
        <div class="p-6">
          <div class="flex justify-between items-start mb-3">
            <h2
              class="text-2xl md:text-3xl lg:text-4xl font-bold text-primary hover:underline cursor-pointer"
              [routerLink]="[`post/${post.id}`]"
            >
              {{ post.title }}
            </h2>
            <span class="badge badge-ghost badge-sm text-xs opacity-70">
              @if (post.car?.version) {
                {{ post.car! | formatCar }}
              } @else {
                Not car associated
              }
            </span>
          </div>

          <p class="text-base-content/80 leading-relaxed mb-4 line-clamp-3">
            {{ post.content }}
          </p>

          <div class="flex items-center justify-between mt-auto pt-4 border-t color-border">
            <div
              class="flex items-center gap-2 cursor-pointer"
              [routerLink]="[`/profile/${post.author?.id}`]"
            >
              <div class="avatar placeholder">
                <div class="color-surface text-neutral-content rounded-full w-8">
                  <img [src]="post.author?.urlAvatar || 'images/profile_image.webp'" alt="Avatar" />
                </div>
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-semibold italic">{{ post.author?.username }}</span>
                <span class="text-xs opacity-50">{{
                  post.date | date: 'dd MMM, yyyy · HH:mm'
                }}</span>
              </div>
            </div>
            <div class="flex flex-col md:flex-row justify-evenly items-center">
              <div class="p-4 text-right pr-6 text-base text-zinc-500 font-mono">
                {{ post.comments }} 💬
              </div>
              <button [routerLink]="[`post/${post.id}`]" class="btn btn-primary btn-sm btn-outline">
                Read more...
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
