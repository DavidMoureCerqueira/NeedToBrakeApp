<div
  class="card w-full max-w-87.5 shadow-2xl transition-all border"
  [style.background]="theme().backGroundPrimary"
  [style.border]="theme().border"
  [style.color]="theme().text"
>
  <div
    class="w-full h-48 flex flex-row relative overflow-hidden rounded-t-xl border-b border-border"
    [style.background]="theme().backGroundSecondary"
  >
    @if (isWarning()) {
      <div class="absolute right-0 top-0 group inline-block z-30">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none" />
          <defs>
            <mask id="SVGG1he6d3K">
              <g stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                <path
                  fill="#fff"
                  fill-opacity="0"
                  stroke="#fff"
                  stroke-dasharray="54"
                  d="M12 4c4.42 0 8 3.58 8 8c0 4.42 -3.58 8 -8 8c-4.42 0 -8 -3.58 -8 -8c0 -4.42 3.58 -8 8 -8"
                >
                  <animate
                    fill="freeze"
                    attributeName="stroke-dashoffset"
                    dur="0.6s"
                    values="54;0"
                  />
                  <animate
                    fill="freeze"
                    attributeName="fill-opacity"
                    begin="1.3s"
                    dur="0.4s"
                    to="1"
                  />
                </path>
                <g fill="none" stroke="#000">
                  <path stroke-dasharray="6" stroke-dashoffset="6" d="M12 8v4">
                    <animate
                      fill="freeze"
                      attributeName="stroke-dashoffset"
                      begin="1.8s"
                      dur="0.2s"
                      to="0"
                    />
                  </path>
                  <path stroke-dasharray="4" stroke-dashoffset="4" d="M12 16v0.01">
                    <animate
                      fill="freeze"
                      attributeName="stroke-dashoffset"
                      begin="2s"
                      dur="0.2s"
                      to="0"
                    />
                  </path>
                </g>
              </g>
            </mask>
          </defs>
          <path fill="var(--fav-color)" d="M0 0h24v24H0z" mask="url(#SVGG1he6d3K)" />
          <g
            fill="none"
            stroke="var(--fav-color)"
            stroke-dasharray="20"
            stroke-dashoffset="20"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
          >
            <path d="M4.22 4.22c-4.29 4.3 -4.29 11.26 0 15.56">
              <animate
                fill="freeze"
                attributeName="stroke-dashoffset"
                begin="0.7s"
                dur="0.3s"
                to="0"
              />
            </path>
            <path d="M19.78 4.22c4.29 4.3 4.29 11.26 0 15.56">
              <animate
                fill="freeze"
                attributeName="stroke-dashoffset"
                begin="1s"
                dur="0.3s"
                to="0"
              />
            </path>
          </g>
        </svg>
        <div
          class="absolute right-full top-1/2 -translate-y-1/2 mr-2 pointer-events-none opacity-0 scale-95 group-hover:opacity-100 group-hover:scale-100 transition-all duration-200 ease-out z-50 whitespace-nowrap rounded bg-[#e4f70a] px-2.5 py-1 text-xs font-bold text-black shadow-xl"
        >
          Incomplete data. Preview may vary.

          <div
            class="absolute top-1/2 -translate-y-1/2 left-full border-4 border-transparent border-l-[#e4f70a]"
          ></div>
        </div>
      </div>
    }
    <konva-disc-component
      class="h-full w-[70%]"
      [(isWarning)]="isWarning"
      [disc]="disc()"
      [bgColor]="theme().backGroundSecondary"
    ></konva-disc-component>

    <konva-profile-disc-component
      class="h-full w-[30%] border-l border-border"
      [disc]="disc()"
      [bgColor]="theme().backGroundSecondary"
    ></konva-profile-disc-component>
  </div>

  <div class="card-body p-5">
    <h2
      class="text-2xl md:text-3xl lg:text-4xl font-black uppercase tracking-tighter italic mb-4 border-l-4 border-error pl-2"
    >
      {{ title() }}
    </h2>

    <div class="space-y-1">
      @for (item of disc() | keyvalue; track item.key) {
        @if (item.key !== 'id') {
          <div class="flex justify-between items-center py-1 border-b border-border last:border-0">
            <span class="text-xs font-bold text-(--secondary-text-color)uppercase tracking-widest">
              {{ item.key }}
            </span>
            <span class="text-sm font-semibold">
              {{ item.value || '---' }}
            </span>
          </div>
        }
      }
    </div>
  </div>
</div>
