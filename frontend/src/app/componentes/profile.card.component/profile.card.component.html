<div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full min-h-0 items-stretch">
  <div class="relative group flex justify-center items-center min-h-0 py-4 md:py-0">
    <img
      class="w-32 h-32 md:w-48 md:h-48 lg:w-64 lg:h-64 aspect-square rounded-full object-cover shadow-2xl border-4 border-border shrink-0"
      src="{{ profile().urlAvatar || 'images/profile_image.webp' }}"
      alt="Avatar"
    />
    <div
      class="absolute bottom-1 right-1 bg-primary text-(--main-text-color) p-2 rounded-full shadow-lg md:hidden"
      (click)="fileInput.click()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        viewBox="0 0 16 16"
      >
        <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z" />
        <path
          d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1zm9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z"
        />
      </svg>
    </div>
    <div
      class="absolute w-32 h-32 md:w-48 md:h-48 lg:w-64 lg:h-64 aspect-square rounded-full color-surface hidden group-hover:flex flex-col items-center justify-center gap-2 transition-all duration-300"
    >
      <button class="btn btn-active" (click)="fileInput.click()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path
            fill="none"
            stroke="#3b82f6"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-miterlimit="10"
            stroke-width="1.5"
            d="M6 12h12m-6 6V6"
          />
        </svg>
      </button>
    </div>
    <input
      #fileInput
      type="file"
      class="hidden"
      accept=".jpg, .jpeg, .png, .webp, image/jpeg, image/png, image/webp"
      (change)="onFileSelected($event)"
    />
  </div>

  <div
    class="relative color-surface p-6 md:p-8 rounded-2xl border border-border flex flex-col justify-between gap-4 shadow-inner min-h-0"
  >
    <app-personal-data-component [profile]="profile()"></app-personal-data-component>

    <div class="flex flex-row justify-evenly items-center">
      <div
        class="bg-red-950/30 px-4 py-2 rounded-full border border-red-900/40 text-2xs text-red-400 font-black uppercase tracking-widest"
      >
        🏎️ {{ profile().numCars }} Cars
      </div>
      <div
        class="bg-(--base-bg) px-4 py-2 rounded-full border border-border text-2xs text-(--secondary-text-color)font-black uppercase tracking-widest"
      >
        📝 {{ profile().numPosts }} Posts
      </div>
      <div
        class="bg-(--base-bg) px-5 py-2 rounded-full border border-border text-2xs text-(--secondary-text-color)font-black uppercase tracking-widest"
      >
        💬 {{ profile().numComments }} Comments
      </div>
    </div>
  </div>
</div>
